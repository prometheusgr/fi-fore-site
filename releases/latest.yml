releaseNotes: |
  Your ratio, read at a glance and traced to its numbers: Home and Days show the Forecast, Current and Target 50/30/20 side by side, every figure opens "How it adds up", and Days now flags what surprised you and lets you fix it in place.

  ### New

  - **A Ratio card on Home and on Days.** It shows Forecast, Current and the 50/30/20 Target side by side for the month you are looking at. Past months use actuals only. Months > Mix has a collapsed "How it adds up" for each block, with each category linked to its transactions (or, for the Forecast, to its plan items).
  - **Compare your mix with households like yours.** Pick a yearly household income band under the Mix chart to see that band's average next to your Needs, Wants and Invest shares. The band is a share of income before taxes, and your ratios use take-home pay. A "Needs come first" card appears on Mix when your Needs have run above your band for three months.
  - **Days flags what needs a look.** A "To look at" list shows charges not in your plan, charges above or below their plan amount, and plan items that have not shown up. Each row has a one-click fix with Undo. Set how far off a charge can be before it is flagged under Setup > Plan > Surprises (10% by default).
  - **Change a forecast's category from its line on Days.** A pencil on a missed forecast line opens a picker. A recurring forecast asks whether to change the whole series (the default) or this month only.
  - **Forecasted income on Days.** The Categories section has an Income table under spending, with Arrived, Plan and a "short" or "extra" difference.
  - **Accept all suggested matches in one click,** with Undo. Weak suggestions are hidden in Needs Review, and each row has one main action.
  - **A bill whose description changes every month still matches its plan item.** A policy number, reference or date at the end of the description no longer keeps the bill from matching.
  - **Set, edit and remove a category budget from Days in two clicks.** Budgeted rows show a pace tick and "ahead" or "under pace" wording, and past months read "Closed $38 under". Categories shows which categories carry a budget, with a Set plan button.
  - **Recent matched actuals show beside a forecast amount.**
  - **Months shows the big and irregular items coming up,** and Home's "Where am I headed" lists its top Coming up items.
  - **Create Forecast suggests a start month** and shows the evidence for it.
  - **Assign unassigned income to a bucket from the Mix footnote.**
  - **fi-fore opens on the landing page you saved.**

  ### Changed

  - **Needs is teal, Wants violet and Invest burnt orange,** and money is neutral: no green income or pink money out. The Needs and Invest fills are darker so their white labels are readable.
  - **The Days month arrows stop at the first and last month with transactions,** with a note ("Oldest data" or "Latest data") under the bar.
  - **A charge you have paid but not yet matched to its plan item counts once,** in the Current ratio, in the cash outlook and in To look at, instead of twice.
  - **Refunds reduce their category in the Mix ratio,** and spending with no category is no longer counted as "Income not spent".
  - **Each page has one title.** The active sub-nav item is accent and bold.
  - **A below-zero Projected EOM shows in danger text,** and a future month's Cash Status is projected through the months in between.

  ### Fixed

  - **Saving or deleting a forecast item shows the real error message** (for example "Start month must not be after the end month"), and bad forecast input is answered as a bad request instead of a server error.
  - **Days Starting Cash for your oldest month** works out from the statement balance instead of showing N/A.
  - **An account synced today no longer reads "stale" on Home.**
  - **Categories, Month in Review, Needs Review and Charges rows fit a phone screen** without scrolling sideways.
  - **Needs Review keeps its state after a category change,** and Days refreshes after an inline Confirm.
  - **Undo on a removed category budget restores its links.**
  - **The Years Base Projection line is drawn dashed,** as a plan.
