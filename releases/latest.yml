releaseNotes: |
  A weekly check-in, end to end: Home tells you where you are and where you're headed, bank balances are checked on every sync, and the month and year pages show the plan next to what happened.

  ### New

  - **Home is the landing page.** It answers "Where am I now?" and "Am I on plan?", then "Where am I headed?" from your monthly forecast. A next-step strip says what to do next, and "Your data" shows each account's history range and when it last updated. Your mix and data freshness moved here from Days.
  - **Your mix on Days and Month.** A Your mix card shows the month-end forecast ratio, and the Mix lens shows it too. Both read from one verdict, so they agree. A ratio gap says what drives it, and income not yet assigned to a bucket is marked on the bar as counted in Invest.
  - **The 20% bucket is named Invest** everywhere you see it.
  - **Fi-fore checks its balance against your bank's on every SimpleFIN sync.** Pending charges and rows after the bank's balance date are left out of the check. The hint is worded for credit cards ("owed"). A bank that needs a re-login says so and links to SimpleFIN Bridge, and Reconnect opens the institution's sign-in page. Sync now stays available after a re-login is needed. Fi-fore also says how many SimpleFIN charges are still pending.
  - **Backfill history from SimpleFIN a few requests a day** until the bank runs out of history, and **add older history to an account from a CSV**, imported as history.
  - **Reuse your saved CSV mapping** on repeat imports. Folder imports and bank downloads work with accounts that have several mappings, and a file that fails in a folder import is shown as an error in plain words, with its reason.
  - **The import preview leads with its Import action,** with the rows tucked away below.
  - **Account summary in the sidebar** (and in the phone More menu), with the real balance basis as visible text and in its tooltip.
  - **Plan vs. actual on Month in Review.** Month in Review also links from Days and from the Month lens bar, and handles a month not started, money left in the plan, and no "-0".
  - **Years: Charges, Mix and Cash lenses** with a year stepper. The current year comes from the monthly forecast, and the page says so.
  - **Week and the Mix lens have empty states,** and so does the Month Cash lens when the plan has no items.
  - **Delay a forecast into a month.** A recurring forecast delayed into a month is planned and matched there, tagged "Delayed in" on the Charges list, and a delayed-in reconciliation row offers Cancel and Delay.
  - **Create a category inline** in the Forecast add and edit modal.
  - **Undo notice for Mark as Reviewed.** One shared Undo notice replaces the old one.
  - **The Days month stepper stays in the jump-to bar,** and the Days chrome fits a 390px phone (jump bar, check-in strip, Back to Top).
  - **When Days has nothing left to review,** it offers the month-over-month view instead of praise for an empty month.

  ### Changed

  - **A new forecast starts at its oldest matching month.**
  - **Month balances include the bank's opening balance** in the sidebar, Accounts, forecast balances and Days. The statement opening adjustment lands in the account's own first month, and the starting balance is re-derived once no statement balance anchors the account.
  - **Month Cash basis counts child categories** in the needs runway, and says which basis the Projected EOM tooltip uses for past and future months.
  - **The Month Charges list shows the effective plan,** so its rows sum to the cards. Overview variance is hidden for a month not started, and Other Categories variance and percent come from its totals.
  - **A matched-then-cancelled forecast stays in the Days plan.**
  - **The Transactions filter bar updates without a page reload,** and rows with equal values keep a stable order.
  - **The SimpleFIN account mapping intro** matches the New account default, and the old import preview hides while the mapping editor is open.

  ### Fixed

  - The balance projection no longer counts forecasts with no target month in every month.
  - Days Your mix: the forecast row follows the account-type filter.
  - Days no longer praises an empty month in Needs Review.
  - Import reports success when only bookkeeping after the import fails, and takes the statement balance only from rows the import accepted.
  - A header-named Amount column stays an amount when many rows are zero.
  - The Days finish link opens at the top, in a success alert.
  - Forecast review state is kept per occurrence.
  - Days Data Freshness names the stale account.

  ### Known gaps

  - Cancelling a matched delayed-in occurrence drops it from the plan and leaves its match behind.
  - Forecast Delay and Cancel validation errors return a server error instead of a clear message.
  - The landing-page preference is saved but not read at app start.
