releaseNotes: |
  Categorization you can trust: rules tell you what they will do before they do it, and you can change or undo them.

  ### New

  - **Change your rule.** When you hand-edit a row that a rule filed and pick a different category, the offer reads "Change your rule for "VONS" to Dining?" and says how many transactions will change. Update rule moves the rows that rule set; rows you categorized by hand stay where they are. "Just this one" files only that row. Undo puts the rule back and returns the rows it moved to the category the bank gave them.
  - **Add and edit rules on the Category rules page.** Add rule opens a form with a live "Matches now" count as you type. Each rule has an Edit button. If you change a rule's category and it had set transactions, fi-fore asks "Change N transactions from A to B?" with Change them or Only new imports. A duplicate pattern shows its message in the form without losing what you typed.
  - **The rule offer says where the money lands.** "Groceries counts toward Needs", with "Assumed" when fi-fore picked the bucket for you (also when the bucket comes from a parent category fi-fore assumed), or "Paycheck counts as income". When rows would change bucket, it adds "moving $1,204.00 from Wants to Needs".
  - **Name your repeat merchants.** After an import or sync, the summary says "86 transactions have no category. Name your repeat merchants". The link opens Transactions with those rows grouped by merchant, most rows first. Pick a category for a group to save a rule and file all its rows. When a group's pattern would also catch other merchants' rows, it says so first ("Also matches 4 other transactions, like ...", "Review first: it also covers ..."), so you can name the longer merchant first. Undo restores the rows.
  - **Transfers between your accounts pair themselves on import.** When one account's charge matches another account's deposit to the cent (Checking −$50, PayPal +$50), the two are paired as a transfer and show under Transfers with an "Auto-paired" tag and an Unpair link. Unpair undoes it, and an import won't pair those two again. The PayPal payment to the vendor stays in Needs Review. Only unique matches pair: an ambiguous one shows as "Looks like a transfer" with Pair and Not a transfer, and transfers already in your history appear the same way, with Pair all when there is more than one. Existing transactions are never paired without your say.
  - **The Import window says what is missing before a bank can be downloaded from.** The Download card reads "PayPal has a login URL but no account. Link one" or "Ready: PayPal", with a "Bank added ✓ · Account linked ✗ · Ready to download" line. A bank with a login URL and no account shows Create account on Bank Setup, then offers Open in bank browser. The bank browser shows three steps (Log in, Download your statement as CSV, Confirm columns), labels each tab with its account, and sends a download to the tab's account without asking when the bank has only one.
  - **Import summaries say how many rows need a category,** with a link to them. This covers CSV upload, folder import, the bank browser and SimpleFIN sync. With nothing to categorize, the sentence isn't there.
  - **Uncategorized in the Transactions category filter.** Pick it to list the rows that have no category. A row you give a category leaves the list on the next load.
  - **A real category hierarchy for new households.** Home (Home Mortgage, Rent, HOA and more), Food (Groceries, Restaurants, Meal Delivery), Medical, Entertainment, Transportation, Family, Shopping, Bills & Subscriptions and Services (memberships and identity services such as AAA), each leaf already in Needs, Wants or Savings and marked Assumed until you confirm it. A bank's "Mortgages" lands in Home Mortgage, and "Healthcare/Medical" in Medical.
  - **Move an existing household to the new categories.** On Setup > Categories, "Starter categories have a new layout" says how many of your categories can move under Home, Food, Medical and more. Review changes opens a preview of every rename (Mortgages becomes Home Mortgage) and every category it would add, Services included, each with a checkbox and the bucket it counts toward. Apply changes at once, or Keep my categories. Nothing changes until you press Apply. Renames keep your transactions, forecasts, notes and rules; a bucket you chose stays as it is; a name you already have is skipped and listed under Not offered; a starter category you deleted is not brought back. Lines you leave unchecked are not offered again.
  - **The Categories list shows where each category counts.** A category with no bucket of its own shows its bucket and "inherited from Entertainment". A parent whose children are in different buckets shows "Mixed", with a hint about where rows filed directly under it count. Assumed shows wherever the bucket was picked for you.
  - **Category sync says what it did.** "Synced 3 new categories. fi-fore picked a bucket for each (shown as Assumed). Confirm or change them below."

  ### Changed

  - **The rule offer is easier to notice.** The bar is tinted with a thick left edge and a "Rule suggestion" label, and it slides in once (not with reduced motion).
  - **Days updates in place** when you change a category or apply or undo a rule. The page doesn't repaint: your scroll position, the Jump to bar and collapsed groups stay.
  - **Cash Status shows the whole plan for a past or future month.** A fully reconciled month used to show $0 forecast; now its Forecast Revenue, Expense and Net show the plan, labelled Month plan. The current month still shows what remains. The burn-rate strip uses the same words: Month plan for past and future months, Forecast remaining for the current one.
  - **Uncategorized means no category.** A row filed under an existing category is never counted as needing one, even if that category has no bucket. The bucket filter's "Uncategorized (defaulted to Wants)" now reads "No category".
  - **Filtering by a category fi-fore doesn't know matches its exact name,** not any category containing the text.
  - **The import preview no longer lists a bank category as new** when one of your rules files those rows somewhere else.
  - **The desktop Import window offers Open bank browser** (or Set up a bank) next to SimpleFIN and Import a CSV.
  - **Forecasts created from a transaction start in that transaction's account type,** so a credit row gives a Credit forecast.
  - **The SimpleFIN account mapping step has Cancel,** which goes back without saving.

  ### Fixed

  - Needs Review tables (Unmatched Forecasts and Unmatched Transactions) stay inside their panel from phone to desktop widths, and the Action buttons stay reachable.
  - A failed hand-off to the main window from any Import page shows its error; the Import hub used to fail silently.
  - Set up a bank in the desktop Import window opens Bank Setup in the main window. It showed a hand-off error, so a new bank's CSV couldn't be imported against a bank.
  - Clicking a category on the Month dashboard lists that month's transactions, from the 1st. East of UTC it started on the last day of the previous month.
  - Moving a category under a parent with a bucket now updates the bucket of the category's children straight away, so the bucket filter and the Mix Review link agree with the Categories list.
  - The Categories create and edit forms close after a successful save, so you see the updated list.
  - The Categories list keeps its bucket badges, Assumed marks and Confirm buttons after you create, rename, move or delete a category.
  - Deleting a category that Undo would restore a transaction to is refused, with the number of transactions, so Undo never points at a missing category.
  - Scenario items keep their notes and target month in the right fields.
  - The Transactions category filter lists "All Categories" once, not twice.

  ### Known gaps

  - The cash-flow in and out totals still count both sides of a transfer.
  - Rules you saved before this version keep the match type they were saved with.
